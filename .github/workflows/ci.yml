name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check api/ functions exist
        run: |
          if [ -d "api" ] && [ "$(ls -A api)" ]; then
            echo "✓ api/ folder found with files"
          else
            echo "⚠ Warning: api/ folder is empty or missing"
          fi
